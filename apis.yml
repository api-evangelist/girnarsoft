name: GirnarSoft
description: 'GirnarSoft is an India-based enterprise software engineering and IT services
  company headquartered in Jaipur, Rajasthan, with a second delivery centre in Gurugram.
  Founded in 2007 by IIT Delhi alumni Amit and Anurag Jain, it is the technology arm
  of the CarDekho Group and built the consumer marketplaces CarDekho, BikeDekho, Gaadi,
  ZigWheels and PriceDekho. The firm sells outsourced product engineering rather than
  a product API: staff augmentation, dedicated teams and software outsourcing across
  web and mobile development, QA and test automation, business intelligence, data science,
  AI/ML, cloud and DevOps, plus AI-augmented engineering pods and agentic-AI automation.
  It works in banking, insurance, automotive, retail and e-commerce, edtech, SaaS, travel
  and government/PSU, and publishes no public developer portal, API documentation or
  machine-readable specification of its own.'
